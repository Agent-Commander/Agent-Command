name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Install and check command outside checkout
        shell: bash
        run: |
          cargo install --locked --path . --bin agent-command --root "$RUNNER_TEMP/agent-command-install"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agent-command-install/bin/agent-command" --version
          "$RUNNER_TEMP/agent-command-install/bin/agent-command" --help
          "$RUNNER_TEMP/agent-command-install/bin/agent-command" --snapshot "$RUNNER_TEMP/agent-command.svg"
