name: Rust checks
on:
  push:
    branches: [main]
    paths: ['**', '!**.md', '!docs/**', 'README.md']
  pull_request:
    paths: ['**', '!**.md', '!docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-checks-${{ github.event_name == 'pull_request' && github.ref || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --bin agent-command
      - name: Check built command outside checkout
        shell: bash
        env:
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          bin_dir="$RUNNER_TEMP/agent-command-install/bin"
          command_path="$bin_dir/agent-command$EXE_SUFFIX"
          mkdir -p "$bin_dir"
          cp "target/debug/agent-command$EXE_SUFFIX" "$command_path"
          cd "$RUNNER_TEMP"
          "$command_path" --version
          "$command_path" --help
          "$command_path" --snapshot "$RUNNER_TEMP/agent-command.svg"
          test -s "$RUNNER_TEMP/agent-command.svg"
