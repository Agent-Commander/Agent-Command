[package]
name = "agent-command"
version = "0.2.6"
edition = "2021"
rust-version = "1.99"
default-run = "agent-command"

[dependencies]
ratatui = { version = "=0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "=0.29.0"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = "0.4"
sha2 = "0.10.9"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1"

[[bin]]
name = "dev"
path = "src/bin/dev.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
